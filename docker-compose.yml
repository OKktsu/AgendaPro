services:
  postgres:
    image: postgres:17-alpine
    container_name: agendapro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendapro
      POSTGRES_PASSWORD: agendapro
      POSTGRES_DB: agendapro
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendapro -d agendapro']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

